target-version = "py313"
line-length = 100

extend-include = ["*.ipynb"]

exclude = [
    "ambiente-virtual",
    "referencias",
    ".ipynb_checkpoints",
]

[lint]
# E4/E7/E9 (erros de sintaxe e estilo grave) + F (pyflakes: import não usado,
# nome indefinido) + I (ordem dos imports).
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
"*.ipynb" = ["E402"]
